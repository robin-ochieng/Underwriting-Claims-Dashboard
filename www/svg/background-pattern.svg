<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Gradient Background -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient for Patterns -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A73E8;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#00BFA5;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Subtle Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1A73E8" opacity="0.1"/>
    </pattern>
    
    <!-- Wave Pattern -->
    <pattern id="waves" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0,50 Q25,30 50,50 T100,50" stroke="#1A73E8" stroke-width="0.5" fill="none" opacity="0.15"/>
      <path d="M0,60 Q25,40 50,60 T100,60" stroke="#00BFA5" stroke-width="0.5" fill="none" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="100%" height="100%" fill="url(#mainGradient)"/>
  
  <!-- Overlay patterns -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#waves)"/>
  
  <!-- Decorative circles -->
  <circle cx="10%" cy="15%" r="150" fill="url(#accentGradient)" opacity="0.3"/>
  <circle cx="90%" cy="85%" r="200" fill="url(#accentGradient)" opacity="0.25"/>
  <circle cx="85%" cy="20%" r="120" fill="url(#accentGradient)" opacity="0.2"/>
</svg>
